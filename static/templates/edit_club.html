{% extends 'base.html' %}

{% block title %}
{{ text['admin_edit_header'] }} — {{ text['brand'] }}
{% endblock %}

{% block content %}
<div class="container mb-5 mt-4">
    <div class="row justify-content-center">
        <div class="col-lg-10">
            
            <div class="card shadow-lg border-0" style="border-radius: 15px; background-color: #ffffff;">
                <div class="card-body p-4 p-sm-5">
                    
                    <h2 class="text-center mb-4 fw-bold text-dark">
                        {{ text['admin_edit_header'] }}
                    </h2>

                    <form method="POST">
                        <div class="row">
                            
                            <div class="col-md-6 border-end">
                                <h5 class="text-primary mb-4 fw-bold text-center">🇺🇦 Українська</h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Назва гуртка</label>
                                    <input type="text" name="club_name" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.club_name }}" required>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Опис</label>
                                    <textarea name="description" class="form-control text-dark border" rows="4" style="border-radius: 8px;">{{ club.description }}</textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Викладач</label>
                                    <input type="text" name="teacher" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.teacher }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Розклад</label>
                                    <input type="text" name="schedule" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.schedule }}">
                                </div>
                            </div>

                            <div class="col-md-6 ps-md-4 mt-4 mt-md-0">
                                <h5 class="text-warning mb-4 fw-bold text-center">🇬🇧 English</h5>
                                
                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Назва гуртка (EN)</label>
                                    <input type="text" name="club_name_en" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.translation.club_name_en if club.translation else '' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Опис (EN)</label>
                                    <textarea name="description_en" class="form-control text-dark border" rows="4" style="border-radius: 8px;">{{ club.translation.description_en if club.translation else '' }}</textarea>
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Викладач (EN)</label>
                                    <input type="text" name="teacher_en" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.translation.teacher_en if club.translation else '' }}">
                                </div>

                                <div class="mb-3">
                                    <label class="form-label text-secondary fw-semibold">Розклад (EN)</label>
                                    <input type="text" name="schedule_en" class="form-control text-dark border" style="border-radius: 8px;" value="{{ club.translation.schedule_en if club.translation else '' }}">
                                </div>
                            </div>

                        </div>

                        <hr class="opacity-25 my-4">

                        <div class="row justify-content-center">
                            <div class="col-md-4 mb-4 text-center">
                                <label class="form-label text-secondary fw-semibold">{{ text['label_max_members'] }}</label>
                                <input type="number" name="max_members" class="form-control text-dark border text-center" style="border-radius: 8px;" value="{{ club.max_members }}" required>
                            </div>
                        </div>

                        <div class="d-flex justify-content-between">
                            <a href="/admin" class="btn btn-secondary btn-lg fw-bold w-100 me-2 shadow-sm" style="border-radius: 8px;">
                                {{ text['btn_back'] }}
                            </a>
                            <button type="submit" class="btn btn-primary btn-lg w-100 ms-2 fw-bold shadow-sm" style="border-radius: 8px;">
                                {{ text['btn_save_changes'] }}
                            </button>
                        </div>
                    </form>

                </div>
            </div>

        </div>
    </div>
</div>
{% endblock %}
