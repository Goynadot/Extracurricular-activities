{% extends 'base.html' %}

{% block title %}
{{ text['home'] }} — {{ text['brand'] }}
{% endblock %}

{% block content %}

<section class="py-5 text-center bg-dark text-white rounded shadow-sm mb-4">
    <div class="container">
        
        <h1 class="display-4 font-weight-bold">
            {{ text['main_title'] }}
        </h1>
        
        <p class="lead text-light opacity-75">
            {{ text['main_subtitle'] }}
        </p>
        
        <a href="/clubs" class="btn btn-warning btn-lg mt-3 fw-bold">
            {{ text['btn_explore'] }}
        </a>
        
    </div>
</section>

<div class="container mt-5 mb-5">
    <div class="row justify-content-center">
        <div class="col-11 col-md-8">
            
            <div class="card shadow-lg" style="border: 3px solid #ffc107; border-radius: 15px; background-color: #ffffff;">
                <div class="card-body p-4 text-center">
                    
                    <p class="fs-4 fw-bold text-dark mb-0" style="line-height: 1.6;">
                        {{ text['welcome_msg'] }}
                    </p>
                    
                </div>
            </div>
            
        </div>
    </div>
</div>

{% endblock %}
